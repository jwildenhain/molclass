name: MCP Server
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: mcp-server/requirements.txt

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Compile check
      run: python -m py_compile server.py

    - name: Import check
      # Importing (rather than running) exercises every @mcp.tool() registration
      # without needing a live MolClass deployment or a stdio client -- module-load
      # time is exactly when a decorator typo or bad signature would blow up.
      run: python -c "import server; print('server.py imported cleanly')"
