plugins {
    id 'java'
    id 'application'
}

group = 'molclass'
version = '2.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

application {
    // Existing aggregator entry point; provide module name via --args.
    mainClassName = 'molclass.Main'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

dependencies {
    // Rely on pre-bundled local jar dependencies
    implementation fileTree(dir: 'lib', include: ['*.jar'], exclude: ['cdk-2.12.jar', 'weka-stable-3.8.6.jar', 'weka-src.jar'])
    implementation 'org.openscience.cdk:cdk-bundle:2.12'
    implementation 'nz.ac.waikato.cms.weka:weka-stable:3.8.7'

    components {
        withModule('com.github.fommil.netlib:all') {
            allVariants {
                withFiles {
                    // This aggregate publishes a POM as its runtime artifact.
                    // Keep its netlib dependencies, but never put the POM on Java classpaths.
                    removeAllFiles()
                }
            }
        }
    }

    // Explicit test dependencies
    testImplementation 'junit:junit:4.13.2'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'molclass.Main',
            'Class-Path': fileTree(dir: 'lib', include: ['*.jar']).files.collect { "lib/${it.name}" }.join(' ')
        )
    }
}

tasks.named('run') {
    // Keep runtime behavior aligned with deploy.sh.
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    jvmArgs '-Dweka.core.WekaPackageManager.offline=true'
}

test {
    useJUnit()
    maxHeapSize = "4g"
    testLogging {
        events "passed", "skipped", "failed"
    }
}

apply from: 'gradle/v3-migration.gradle'
apply from: 'gradle/v3-features.gradle'
apply from: 'gradle/v3-models.gradle'

apply from: 'gradle/v3-import.gradle'
apply from: 'gradle/v3-approval.gradle'

apply from: 'gradle/v3-audit.gradle'

tasks.register('runtimeClasspathFile') {
    description = 'Writes the runtime classpath so out-of-Docker workers (tools/run_v3_worker.sh) match the build.'
    def target = layout.buildDirectory.file('runtime-classpath.txt')
    outputs.file(target)
    doLast {
        def file = target.get().asFile
        file.parentFile.mkdirs()
        file.text = sourceSets.main.runtimeClasspath.asPath
    }
}
