spring.datasource.url=${MOLCLASS_JDBC_URL:jdbc:mariadb://127.0.0.1:3306/molclass_v3}
spring.datasource.username=${MOLCLASS_DB_USER}
spring.datasource.password=${MOLCLASS_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${MOLCLASS_DB_POOL_MAX:8}
spring.datasource.hikari.minimum-idle=${MOLCLASS_DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${MOLCLASS_DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${MOLCLASS_DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${MOLCLASS_DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${MOLCLASS_DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.initialization-fail-timeout=${MOLCLASS_DB_INITIALIZATION_TIMEOUT_MS:10000}

server.address=${MOLCLASS_PREDICTOR_ADDRESS:127.0.0.1}
server.port=${MOLCLASS_PREDICTOR_PORT:8082}
server.shutdown=graceful
server.tomcat.threads.max=${MOLCLASS_HTTP_THREADS_MAX:32}
server.tomcat.threads.min-spare=${MOLCLASS_HTTP_THREADS_MIN:2}
server.tomcat.max-connections=${MOLCLASS_HTTP_MAX_CONNECTIONS:128}
server.tomcat.accept-count=${MOLCLASS_HTTP_ACCEPT_COUNT:16}
server.error.include-message=never
server.error.include-stacktrace=never
spring.lifecycle.timeout-per-shutdown-phase=${MOLCLASS_SHUTDOWN_TIMEOUT:30s}

molclass.v3.schema=${MOLCLASS_V3_SCHEMA:molclass_v3}
molclass.v3.model-cache-size=${MOLCLASS_V3_MODEL_CACHE_SIZE:4}
molclass.v3.max-compressed-artifact-bytes=${MOLCLASS_V3_MAX_ARTIFACT_BYTES:134217728}
molclass.v3.require-schema-at-startup=${MOLCLASS_V3_REQUIRE_SCHEMA_AT_STARTUP:true}
molclass.legacy-models.enabled=${MOLCLASS_LEGACY_MODELS_ENABLED:false}
molclass.legacy-api.enabled=${MOLCLASS_LEGACY_API_ENABLED:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,molclassV3Schema
